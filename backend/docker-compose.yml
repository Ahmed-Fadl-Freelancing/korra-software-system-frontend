version: "3.9"

services:
  django:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    command: >
      sh -c "python manage.py migrate --run-syncdb &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
